<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뷰티블라썸 이벤트</title><style>body{margin:0;background:#edf0ef;font:16px/1.5 "Malgun Gothic",sans-serif;color:#29252b}main{max-width:1100px;margin:40px auto;padding:24px}button,a{font:inherit}main button{padding:14px 20px;cursor:pointer}main a{color:inherit;margin-left:18px}</style><main><h1>Beauty Blossom</h1><button onclick="BBEvents.open()">이벤트 보기</button><a href="04-live-events-code.txt" download>아임웹 코드</a></main><style>
#bbe { all:initial; box-sizing:border-box; position:fixed; inset:0; margin:auto; padding:0; border:1px solid #686268; border-radius:8px; width:min(1260px,calc(100vw - 32px),calc((100dvh - 190px) * 2.4)); height:fit-content; max-height:calc(100dvh - 24px); overflow:auto; background:#202022; color:#f8f4f6; font:14px/1.45 "Malgun Gothic","Apple SD Gothic Neo",sans-serif; box-shadow:0 28px 90px #0008,inset 0 1px #fff5; letter-spacing:0; }
#bbe:not([open]) { display:none; }
#bbe::backdrop { background:rgb(18 18 20 / 70%); backdrop-filter:blur(4px); }
#bbe *,#bbe *::before,#bbe *::after { box-sizing:border-box; letter-spacing:0; }
#bbe [hidden] { display:none!important; }
#bbe button { appearance:none; font:inherit; color:inherit; background:transparent; border:0; border-radius:0; margin:0; padding:0; cursor:pointer; box-shadow:none; }
#bbe :focus-visible { outline:2px solid #ffc6df; outline-offset:-3px; }
#bbe a { color:inherit; text-decoration:none; }
#bbe .bbe-head { display:flex; align-items:center; gap:12px; min-height:54px; padding:4px 10px 4px 20px; }
#bbe h2 { font-size:16px; line-height:1.4; font-weight:700; margin:0; padding:0; flex:1; color:inherit; }
#bbe .bbe-icon { width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center; font:24px/1 sans-serif; }
#bbe .bbe-icon[aria-pressed="true"] { color:#ffbad7; }
#bbe .bbe-stage { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding:8px 14px 14px; }
#bbe .bbe-card { min-width:0; display:block; position:relative; border-radius:8px; padding:5px; background:linear-gradient(160deg,#48454a,#242326 45%); border:1px solid #ffffff38; box-shadow:inset 0 1px 1px #ffffff5c,0 6px 12px #0003; }
#bbe .bbe-card::after { content:""; position:absolute; bottom:-1px; left:16%; right:16%; height:2px; background:#f7e4ed; box-shadow:0 0 10px 2px #efbed680; opacity:.5; pointer-events:none; transition:opacity .3s; }
#bbe .bbe-card:hover::after,#bbe .bbe-card:focus-visible::after { opacity:1; }
#bbe .bbe-image { position:relative; aspect-ratio:4/5; width:100%; overflow:hidden; border-radius:4px; background:#eeeeef; }
#bbe .bbe-image img { position:absolute; inset:0; width:100%; height:100%; max-width:none; object-fit:contain; display:block; margin:0; opacity:0; transition:opacity .6s ease-in-out; }
#bbe .bbe-image img.bbe-shown { opacity:1; }
#bbe .bbe-card.bbe-empty { visibility:hidden; }
#bbe .bbe-caption { display:block; padding:10px 5px 4px; height:46px; font-size:12px; line-height:16px; overflow:hidden; color:#e1dbe0; }
#bbe .bbe-caption span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
#bbe .bbe-nav { display:flex; align-items:center; justify-content:center; gap:10px; min-height:48px; border-top:1px solid #ffffff18; }
#bbe .bbe-count { font-variant-numeric:tabular-nums; min-width:78px; text-align:center; font-size:13px; }
#bbe .bbe-tabs { display:flex; min-height:48px; overflow-x:auto; background:#151517; border-top:1px solid #ffffff20; }
#bbe .bbe-tab { position:relative; min-width:56px; flex:1; height:48px; font-size:13px; border-right:1px solid #ffffff14; white-space:nowrap; }
#bbe .bbe-tab[aria-selected="true"] { background:linear-gradient(#51424a,#2b2529); color:#ffe8f2; box-shadow:inset 0 -2px #ffc8e0,inset 0 1px #ffffff40; }
#bbe .bbe-foot { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid #ffffff20; }
#bbe .bbe-foot button { min-height:46px; padding:10px; font-size:13px; }
#bbe .bbe-foot button+button { border-left:1px solid #ffffff20; }
#bbe .bbe-state { padding:52px 24px; text-align:center; color:#e2dce0; min-height:210px; }
#bbe .bbe-state a { display:block; margin:20px 0 0; text-decoration:underline; }
#bbe .bbe-state button { display:block; margin:20px auto 0; padding:10px 20px; border:1px solid #ddd8; }
@media(max-width:700px) {
 #bbe { width:min(440px,calc(100vw - 24px),calc((100dvh - 260px) * .8)); min-width:230px; }
 #bbe .bbe-stage { grid-template-columns:minmax(0,1fr); gap:0; padding:4px 10px 12px; }
 #bbe .bbe-card:nth-child(n+2) { display:none; }
 #bbe .bbe-caption { height:42px; }
 #bbe .bbe-head { padding-left:14px; gap:2px; }
 #bbe h2 { font-size:14px; }
 #bbe .bbe-tab { min-width:44px; }
}
@media(prefers-reduced-motion:reduce) { #bbe .bbe-image img,#bbe .bbe-card::after { transition:none; } }

</style>
<script>
(function () {
  'use strict';
  if (window.BBEvents) return;
  const ENDPOINT = 'https://beautyblossom-popup-feed.beautyblossom.workers.dev/events';
  const SOURCE = 'https://beautyblossom.kr/22';
  const KEY = 'bb-events-v2-hideUntil';
  const INTERVAL = 1800;
  const mobile = matchMedia('(max-width:700px)'), reduced = matchMedia('(prefers-reduced-motion:reduce)');
  let dialog, stage, tabs, state, nav, count, pauseButton, timer, refreshTimer, request;
  let items=[], cards=[], index=0, generation=0, paused=reduced.matches, busy=false, focusBefore, overflow, locked=false;
  const preloads = new Map();
  const size = () => mobile.matches ? 1 : 3;
  const pageCount = () => Math.ceil(items.length / size());
  function node(tag, cls, text) { const e=document.createElement(tag); if(cls)e.className=cls; if(text)e.textContent=text; return e; }
  function button(text, cls, label, fn) { const b=node('button',cls,text); b.type='button'; if(label){b.title=label;b.setAttribute('aria-label',label);} b.addEventListener('click',fn); return b; }
  function imageOK(url) {
    if (!preloads.has(url)) preloads.set(url,new Promise(resolve=>{
      const im=new Image(); const t=setTimeout(()=>resolve(false),10000);
      im.onload=()=>{clearTimeout(t);resolve(im.naturalWidth>0);}; im.onerror=()=>{clearTimeout(t);resolve(false);}; im.src=url;
    }));
    return preloads.get(url);
  }
  function stop() { clearTimeout(timer); timer=null; }
  function schedule() {
    stop();
    if(dialog?.open && !paused && !document.hidden && pageCount()>1 && !busy) timer=setTimeout(()=>show(index+1),INTERVAL);
  }
  function syncPause() { pauseButton.textContent=paused?'▶':'Ⅱ'; pauseButton.setAttribute('aria-pressed',String(paused)); pauseButton.setAttribute('aria-label',paused?'자동 전환 재생':'자동 전환 일시정지'); pauseButton.title=pauseButton.getAttribute('aria-label'); }
  function pause(value) { paused=value; syncPause(); schedule(); }
  function renderTabs() {
    tabs.replaceChildren();
    for(let p=0;p<pageCount();p++) {
      const first=p*size()+1, last=Math.min(first+size()-1,items.length);
      const b=button(size()===1?String(first):first+'~'+last,'bbe-tab',first+'번째 이벤트부터 보기',()=>{pause(true);show(p);});
      b.setAttribute('role','tab'); b.id='bbe-tab-'+p; b.setAttribute('aria-controls','bbe-stage');
      b.addEventListener('keydown',e=>{
        let next;
        if(e.key==='ArrowRight')next=(p+1)%pageCount();
        if(e.key==='ArrowLeft')next=(p+pageCount()-1)%pageCount();
        if(e.key==='Home')next=0;
        if(e.key==='End')next=pageCount()-1;
        if(next!==undefined){e.preventDefault();pause(true);show(next);tabs.children[next].focus();}
      });
      tabs.append(b);
    }
  }
  async function show(next, immediate=false) {
    stop(); if(!items.length)return;
    const token=++generation; busy=true;
    const target=(next+pageCount())%pageCount(), row=items.slice(target*size(),target*size()+size());
    const ready=await Promise.all(row.map(item=>imageOK(item.image)));
    if(token!==generation||!dialog.open)return;
    index=target;
    cards.forEach((card,i)=>{
      const item=row[i]; card.classList.toggle('bbe-empty',!item);
      if(!item){card.removeAttribute('href');card.tabIndex=-1;card.setAttribute('aria-hidden','true');return;}
      card.tabIndex=0;card.removeAttribute('aria-hidden');card.href=item.href;card.setAttribute('aria-label',item.title+' 상세 보기');
      const imgs=card.querySelectorAll('img'), current=card.dataset.layer==='1'?1:0, nextLayer=1-current;
      const incoming=imgs[nextLayer], outgoing=imgs[current];
      incoming.alt=item.title; incoming.src=ready[i]?item.image:'';
      if(!ready[i])incoming.removeAttribute('src');
      incoming.style.transition=immediate?'none':''; outgoing.style.transition=''; incoming.classList.add('bbe-shown'); outgoing.classList.remove('bbe-shown');card.dataset.layer=String(nextLayer);
      card.querySelector('.bbe-caption span').textContent=ready[i]?item.title:'이미지를 불러오지 못했습니다. 상세 보기';
    });
    [...tabs.children].forEach((tab,p)=>{tab.setAttribute('aria-selected',String(p===index));tab.tabIndex=p===index?0:-1;});
    stage.setAttribute('aria-labelledby','bbe-tab-'+index);
    count.textContent=(index*size()+1)+'~'+Math.min((index+1)*size(),items.length)+' / '+items.length;
    busy=false; schedule();
    const start=((index+1)%pageCount())*size(); items.slice(start,start+size()).forEach(item=>imageOK(item.image));
  }
  function restore() { if(!locked||dialog.open)return;locked=false;document.documentElement.style.overflow=overflow;if(focusBefore?.isConnected)focusBefore.focus({preventScroll:true}); }
  function close() { if(!dialog?.open)return;stop();clearInterval(refreshTimer);generation++;request?.abort();request=null;busy=false;dialog.close();restore(); }
  function hideToday() { const date=new Date();date.setHours(24,0,0,0);try{localStorage.setItem(KEY,String(+date));}catch(_){}close(); }
  function build() {
    dialog=node('dialog');dialog.id='bbe';dialog.setAttribute('aria-labelledby','bbe-title');
    const head=node('header','bbe-head'), title=node('h2','','뷰티블라썸 이벤트');title.id='bbe-title';
    pauseButton=button('Ⅱ','bbe-icon','자동 전환 일시정지',()=>pause(!paused));
    head.append(title,pauseButton,button('×','bbe-icon','팝업 닫기',close));
    state=node('div','bbe-state','이벤트를 불러오는 중입니다.');state.setAttribute('role','status');
    stage=node('div','bbe-stage');stage.id='bbe-stage';stage.setAttribute('role','tabpanel');
    for(let i=0;i<3;i++) {
      const card=node('a','bbe-card'), frame=node('div','bbe-image'), caption=node('div','bbe-caption');card.dataset.layer='0';card.target='_blank';card.rel='noopener';
      frame.append(node('img'),node('img'));caption.append(node('span'));card.append(frame,caption);card.addEventListener('click',()=>pause(true));stage.append(card);cards.push(card);
    }
    nav=node('div','bbe-nav');count=node('span','bbe-count');
    nav.append(button('←','bbe-icon','이전 이벤트',()=>{pause(true);show(index-1);}),count,button('→','bbe-icon','다음 이벤트',()=>{pause(true);show(index+1);}));
    tabs=node('div','bbe-tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','이벤트 순서');
    const foot=node('div','bbe-foot');foot.append(button('오늘 하루 보지 않기','','',hideToday),button('닫기','','',close));
    dialog.append(head,state,stage,nav,tabs,foot);document.body.append(dialog);
    dialog.addEventListener('cancel',e=>{e.preventDefault();close();});dialog.addEventListener('close',restore);
    dialog.addEventListener('keydown',e=>{
      if(e.key!=='Tab')return;
      const els=[...dialog.querySelectorAll('button,a[href]')].filter(el=>el.tabIndex>=0&&el.getClientRects().length&&!el.classList.contains('bbe-empty'));
      if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}
      if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}
    });
    dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});
    mobile.addEventListener('change',()=>{if(!dialog.open||!items.length)return;generation++;busy=false;index=0;renderTabs();show(0,true);});
    reduced.addEventListener('change',()=>{if(reduced.matches)pause(true);});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else schedule();});
    syncPause();
  }
  function valid(item) {
    try { const img=new URL(item.image),href=new URL(item.href);return img.protocol==='https:'&&img.hostname==='cdn.imweb.me'&&href.origin==='https://beautyblossom.kr'&&/^\/22\/?$/.test(href.pathname)&&typeof item.title==='string'; } catch(_){return false;}
  }
  async function refresh() {
    if(request || !dialog.open)return;
    request=new AbortController();const controller=request,timeout=setTimeout(()=>controller.abort(),20000);
    try {
      const response=await fetch(ENDPOINT,{signal:controller.signal,cache:'no-cache',credentials:'omit'});
      if(!response.ok)throw new Error('feed');
      const data=await response.json(),next=Array.isArray(data.items)?data.items.filter(valid):[];
      if(!next.length||data.truncated||next.length!==data.items.length)throw new Error('invalid_feed');
      if(!dialog.open||request!==controller)return;
      const changed=JSON.stringify(items)!==JSON.stringify(next);
      items=next;state.hidden=true;stage.hidden=false;tabs.hidden=false;nav.hidden=false;
      if(changed){preloads.clear();renderTabs();await show(0,true);}else if(!busy)schedule();
    } catch(_) {
      if(!dialog.open||request!==controller)return;stop();generation++;busy=false;items=[];
      stage.hidden=true;tabs.hidden=true;nav.hidden=true;state.hidden=false;
      state.textContent='이벤트를 불러오지 못했습니다.';
      const a=node('a','','이벤트 페이지 열기');a.href=SOURCE;a.target='_blank';a.rel='noopener';
      state.append(a,button('다시 시도','','',()=>refresh()));
    } finally { clearTimeout(timeout);if(request===controller)request=null; }
  }
  function open(respectHidden=false) {
    if(!document.body){document.addEventListener('DOMContentLoaded',()=>open(respectHidden),{once:true});return;}
    try{if(respectHidden&&Number(localStorage.getItem(KEY))>Date.now())return;}catch(_){}
    if(!dialog)build();if(dialog.open)return;
    focusBefore=document.activeElement;overflow=document.documentElement.style.overflow;
    dialog.showModal();locked=true;document.documentElement.style.overflow='hidden';
    stage.hidden=true;tabs.hidden=true;nav.hidden=true;state.hidden=false;state.textContent='이벤트를 불러오는 중입니다.';
    items=[];refresh();clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!document.hidden)refresh();},60000);
  }
  window.BBEvents=Object.freeze({open,close});
  if (true) open(true);
}());

</script></html>
