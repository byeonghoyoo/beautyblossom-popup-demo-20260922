 #bbe .bbe-stage { grid-template-columns:minmax(0,1fr); gap:0; padding:4px 10px 12px; }
 #bbe .bbe-card:nth-child(n+2) { display:none; }
 #bbe .bbe-caption { height:42px; }
 #bbe .bbe-head { padding-left:14px; gap:2px; }
 #bbe h2 { font-size:14px; }
 #bbe .bbe-tab { font-size:12px; padding:8px 4px; }
}
@media(prefers-reduced-motion:reduce) { #bbe .bbe-image img { transition:none; } }

.bb-dragcue { position:absolute; inset:0; z-index:5; pointer-events:none!important; overflow:hidden; opacity:0; }
.bb-dragcue * { box-sizing:border-box; pointer-events:none!important; }
.bb-dragcue-frame { position:absolute; inset:16px; border:2px solid #8bddf9; transform-origin:top left; }
.bb-dragcue-handle { position:absolute; width:12px; height:12px; background:#9ce3fc; border:1px solid #e7faff; }
.bb-dragcue-handle.tl { top:-7px; left:-7px; }
.bb-dragcue-handle.tr { top:-7px; right:-7px; }
.bb-dragcue-handle.bl { bottom:-7px; left:-7px; }
.bb-dragcue-handle.br { bottom:-7px; right:-7px; }
.bb-dragcue-cursor { position:absolute; bottom:-25px; right:-25px; width:32px; height:32px; filter:drop-shadow(0 2px 2px #0003); }
.bb-dragcue[data-playing="true"] { animation:bb-cue-visibility 3.2s ease both; }
.bb-dragcue[data-playing="true"] .bb-dragcue-frame { animation:bb-cue-drag 3.2s ease-in-out both; }
.bb-dragcue[data-playing="true"] .bb-dragcue-cursor { animation:bb-cue-cursor 3.2s ease-in-out both; }
@keyframes bb-cue-visibility { 0%,100%{opacity:0} 12%,82%{opacity:1} }
@keyframes bb-cue-drag { 0%,28%,80%,100%{transform:scale(.96,.94)} 52%,65%{transform:scale(1,1)} }
@keyframes bb-cue-cursor { 0%,12%{transform:translate(34px,26px);opacity:0} 28%,75%{transform:translate(0,0);opacity:1} 100%{transform:translate(26px,22px);opacity:0} }
@media(prefers-reduced-motion:reduce) { .bb-dragcue { display:none!important; } }

</style>
<script>
(function(){
  'use strict';
  if(window.BBDragCue)return;
  window.BBDragCue=function(target){
    const cue=document.createElement('div');cue.className='bb-dragcue';cue.setAttribute('aria-hidden','true');
    const frame=document.createElement('div');frame.className='bb-dragcue-frame';
    for(const corner of ['tl','tr','bl','br']){const handle=document.createElement('i');handle.className='bb-dragcue-handle '+corner;frame.append(handle);}
    const cursor=document.createElement('span');cursor.className='bb-dragcue-cursor';
    // Lucide MousePointer2, decorative and never an interactive target.
    cursor.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="white" stroke="#252b31" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7.07 17 2.51-7.39L21 11.07 4 4z"/></svg>';
    frame.append(cursor);cue.append(frame);target.append(cue);
    const reduced=matchMedia('(prefers-reduced-motion:reduce)');let raf;
    function stop(){cancelAnimationFrame(raf);cue.removeAttribute('data-playing');}
    function play(){stop();if(reduced.matches)return;raf=requestAnimationFrame(()=>{raf=requestAnimationFrame(()=>{cue.dataset.playing='true';});});}
    cue.addEventListener('animationend',e=>{if(e.animationName==='bb-cue-visibility')stop();});
    reduced.addEventListener('change',()=>{if(reduced.matches)stop();});
    return Object.freeze({play,stop});
  };
}());

(function () {
  'use strict';
  if (window.BBEvents) return;
  const ENDPOINT = 'https://beautyblossom-popup-feed.beautyblossom.workers.dev/events';
  const SOURCE = 'https://beautyblossom.kr/22';
  const KEY = 'bb-events-v2-hideUntil';
  const INTERVAL = 1800;
  const sections = [
    {title:'이벤트'},
    {title:'첫 방문 상담',file:'welcome.png'},
    {title:'리프팅 상담',file:'lifting.png'},
    {title:'환절기 피부 상담',file:'skin.png'}
  ];
  const imageBase='https://cdn.beautyblossomth.kr/popup-tests/2026-09-22/glass-v1/';
  const mobile = matchMedia('(max-width:700px)'), reduced = matchMedia('(prefers-reduced-motion:reduce)');
  let dialog, stage, tabs, state, pauseButton, timer, refreshTimer, request;
  let items=[], cards=[], index=0, generation=0, paused=reduced.matches, busy=false, focusBefore, overflow, locked=false;
  let activeTab=0, panels=[], dragCue, cuePending=false;
  const preloads = new Map();
  const size = () => mobile.matches ? 1 : 3;
  const pageCount = () => Math.ceil(items.length / size());
  function node(tag, cls, text) { const e=document.createElement(tag); if(cls)e.className=cls; if(text)e.textContent=text; return e; }
  function button(text, cls, label, fn) { const b=node('button',cls,text); b.type='button'; if(label){b.title=label;b.setAttribute('aria-label',label);} b.addEventListener('click',fn); return b; }
  function imageOK(url) {
    if (!preloads.has(url)) preloads.set(url,new Promise(resolve=>{
      const im=new Image(); const t=setTimeout(()=>resolve(false),10000);
      im.onload=()=>{clearTimeout(t);resolve(im.naturalWidth>0);}; im.onerror=()=>{clearTimeout(t);resolve(false);}; im.src=url;
    }));
    return preloads.get(url);
  }
  function stop() { clearTimeout(timer); timer=null; }
  function schedule() {
    stop();
    if(dialog?.open && activeTab===0 && !paused && !document.hidden && pageCount()>1 && !busy) timer=setTimeout(()=>show(index+1),INTERVAL);
  }
  function syncPause() { pauseButton.textContent=paused?'▶':'Ⅱ'; pauseButton.setAttribute('aria-pressed',String(paused)); pauseButton.setAttribute('aria-label',paused?'자동 전환 재생':'자동 전환 일시정지'); pauseButton.title=pauseButton.getAttribute('aria-label'); }
  function pause(value) { paused=value; syncPause(); schedule(); }
  function syncView() {
    stage.hidden=activeTab!==0||!items.length;
    state.hidden=activeTab!==0||items.length>0;
    pauseButton.hidden=activeTab!==0;
    panels.forEach((panel,i)=>{panel.hidden=activeTab!==i+1;});
    [...tabs.children].forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===activeTab));tab.tabIndex=i===activeTab?0:-1;});
  }
  function selectTab(next,focus=false) {
    stop();generation++;busy=false;activeTab=(next+sections.length)%sections.length;
    syncView();
    if(activeTab===0){cuePending=true;if(items.length)show(index,true);}else{cuePending=false;dragCue.stop();}
    if(focus)tabs.children[activeTab].focus();
  }
  function renderTabs() {
    tabs.replaceChildren();
    sections.forEach((section,i)=>{
      const tab=button(section.title,'bbe-tab','',()=>selectTab(i));
      tab.id='bbe-tab-'+i;tab.setAttribute('role','tab');
      tab.setAttribute('aria-controls',i===0?'bbe-stage':'bbe-panel-'+i);
      tab.addEventListener('keydown',e=>{
        let next;
        if(e.key==='ArrowRight')next=i+1;
        if(e.key==='ArrowLeft')next=i-1;
        if(e.key==='Home')next=0;
        if(e.key==='End')next=sections.length-1;
        if(next!==undefined){e.preventDefault();selectTab(next,true);}
      });
      tabs.append(tab);
    });
  }
  async function show(next, immediate=false) {
    stop(); if(!items.length)return;
    const token=++generation; busy=true;
    const target=(next+pageCount())%pageCount(), row=items.slice(target*size(),target*size()+size());
    const ready=await Promise.all(row.map(item=>imageOK(item.image)));
    if(token!==generation||!dialog.open)return;
    index=target;
    cards.forEach((card,i)=>{
      const item=row[i]; card.classList.toggle('bbe-empty',!item);
      if(!item){card.removeAttribute('href');card.tabIndex=-1;card.setAttribute('aria-hidden','true');return;}
      card.tabIndex=0;card.removeAttribute('aria-hidden');card.href=item.href;card.setAttribute('aria-label',item.title+' 상세 보기');
      const imgs=card.querySelectorAll('img'), current=card.dataset.layer==='1'?1:0, nextLayer=1-current;
      const incoming=imgs[nextLayer], outgoing=imgs[current];
      incoming.alt=item.title; incoming.src=ready[i]?item.image:'';
      if(!ready[i])incoming.removeAttribute('src');
      incoming.style.transition=immediate?'none':''; outgoing.style.transition=''; incoming.classList.add('bbe-shown'); outgoing.classList.remove('bbe-shown');card.dataset.layer=String(nextLayer);
      card.querySelector('.bbe-caption span').textContent=ready[i]?item.title:'이미지를 불러오지 못했습니다. 상세 보기';
    });
    stage.setAttribute('aria-labelledby','bbe-tab-0');
    busy=false; schedule();
    if(cuePending&&activeTab===0){cuePending=false;dragCue.play();}
    const start=((index+1)%pageCount())*size(); items.slice(start,start+size()).forEach(item=>imageOK(item.image));
  }
  function restore() { if(!locked||dialog.open)return;locked=false;document.documentElement.style.overflow=overflow;if(focusBefore?.isConnected)focusBefore.focus({preventScroll:true}); }
  function close() { if(!dialog?.open)return;stop();dragCue.stop();clearInterval(refreshTimer);generation++;request?.abort();request=null;busy=false;dialog.close();restore(); }
  function hideToday() { const date=new Date();date.setHours(24,0,0,0);try{localStorage.setItem(KEY,String(+date));}catch(_){}close(); }
  function build() {
    dialog=node('dialog');dialog.id='bbe';dialog.setAttribute('aria-labelledby','bbe-title');
    const head=node('header','bbe-head'), title=node('h2','','뷰티블라썸 소식');title.id='bbe-title';
    pauseButton=button('Ⅱ','bbe-icon','자동 전환 일시정지',()=>pause(!paused));
    head.append(title,pauseButton,button('×','bbe-icon','팝업 닫기',close));
    state=node('div','bbe-state','이벤트를 불러오는 중입니다.');state.setAttribute('role','status');
    stage=node('div','bbe-stage');stage.id='bbe-stage';stage.setAttribute('role','tabpanel');
    for(let i=0;i<3;i++) {
      const card=node('a','bbe-card'), frame=node('div','bbe-image'), caption=node('div','bbe-caption');card.dataset.layer='0';card.target='_blank';card.rel='noopener';
      frame.append(node('img'),node('img'));caption.append(node('span'));card.append(frame,caption);card.addEventListener('click',()=>pause(true));stage.append(card);cards.push(card);
    }
    tabs=node('div','bbe-tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','진료 안내');
    dragCue=window.BBDragCue(stage);
    renderTabs();
    panels=sections.slice(1).map((section,i)=>{
      const panel=node('div','bbe-static'),img=node('img'),error=node('div','bbe-static-error','이미지를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.');
      panel.id='bbe-panel-'+(i+1);panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','bbe-tab-'+(i+1));panel.hidden=true;
      img.alt='뷰티블라썸의원 '+section.title;img.width=809;img.height=477;error.hidden=true;
      img.addEventListener('error',()=>{error.hidden=false;});img.addEventListener('load',()=>{error.hidden=true;});img.src=imageBase+section.file;
      panel.append(img,error);return panel;
    });
    const foot=node('div','bbe-foot');foot.append(button('오늘 하루 보지 않기','','',hideToday),button('닫기','','',close));
    dialog.append(head,state,stage,...panels,tabs,foot);document.body.append(dialog);
    dialog.addEventListener('cancel',e=>{e.preventDefault();close();});dialog.addEventListener('close',restore);
    dialog.addEventListener('keydown',e=>{
      if(e.key!=='Tab')return;
      const els=[...dialog.querySelectorAll('button,a[href]')].filter(el=>el.tabIndex>=0&&el.getClientRects().length&&!el.classList.contains('bbe-empty'));
      if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}
      if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}
    });
    dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});
    mobile.addEventListener('change',()=>{if(!dialog.open||!items.length)return;generation++;busy=false;index=0;if(activeTab===0)show(0,true);});
    reduced.addEventListener('change',()=>{if(reduced.matches)pause(true);});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else schedule();});
    syncPause();
  }
  function valid(item) {
    try { const img=new URL(item.image),href=new URL(item.href);return img.protocol==='https:'&&img.hostname==='cdn.imweb.me'&&href.origin==='https://beautyblossom.kr'&&/^\/22\/?$/.test(href.pathname)&&typeof item.title==='string'; } catch(_){return false;}
  }
  async function refresh() {
    if(request || !dialog.open)return;
    request=new AbortController();const controller=request,timeout=setTimeout(()=>controller.abort(),20000);
    try {
      const response=await fetch(ENDPOINT,{signal:controller.signal,cache:'no-cache',credentials:'omit'});
      if(!response.ok)throw new Error('feed');
      const data=await response.json(),next=Array.isArray(data.items)?data.items.filter(valid):[];
      if(!next.length||data.truncated||next.length!==data.items.length)throw new Error('invalid_feed');
      if(!dialog.open||request!==controller)return;
      const changed=JSON.stringify(items)!==JSON.stringify(next);
      items=next;syncView();
      if(changed){preloads.clear();index=0;if(activeTab===0)await show(0,true);}else if(!busy)schedule();
    } catch(_) {
      if(!dialog.open||request!==controller)return;stop();generation++;busy=false;items=[];
      syncView();
      state.textContent='이벤트를 불러오지 못했습니다.';
      const a=node('a','','이벤트 페이지 열기');a.href=SOURCE;a.target='_blank';a.rel='noopener';
      state.append(a,button('다시 시도','','',()=>refresh()));
    } finally { clearTimeout(timeout);if(request===controller)request=null; }
  }
  function open(respectHidden=false) {
    if(!document.body){document.addEventListener('DOMContentLoaded',()=>open(respectHidden),{once:true});return;}
    try{if(respectHidden&&Number(localStorage.getItem(KEY))>Date.now())return;}catch(_){}
    if(!dialog)build();if(dialog.open)return;
    focusBefore=document.activeElement;overflow=document.documentElement.style.overflow;
    dialog.showModal();locked=true;document.documentElement.style.overflow='hidden';
    state.textContent='이벤트를 불러오는 중입니다.';
    items=[];index=0;activeTab=0;cuePending=true;syncView();refresh();clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!document.hidden)refresh();},60000);
  }
  window.BBEvents=Object.freeze({open,close});
  if (true) open(true);
}());

</script></html>
