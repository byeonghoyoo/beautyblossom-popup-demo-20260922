  }
  async function show(next, immediate=false) {
    stop(); if(!items.length)return;
    const token=++generation; busy=true;
    const target=(next+pageCount())%pageCount(), row=items.slice(target*size(),target*size()+size());
    const ready=await Promise.all(row.map(item=>imageOK(item.image)));
    if(token!==generation||!dialog.open)return;
    index=target;
    cards.forEach((card,i)=>{
      const item=row[i]; card.classList.toggle('bbe-empty',!item);
      if(!item){card.removeAttribute('href');card.tabIndex=-1;card.setAttribute('aria-hidden','true');return;}
      card.tabIndex=0;card.removeAttribute('aria-hidden');card.href=item.href;card.setAttribute('aria-label',item.title+' 상세 보기');
      const imgs=card.querySelectorAll('img'), current=card.dataset.layer==='1'?1:0, nextLayer=1-current;
      const incoming=imgs[nextLayer], outgoing=imgs[current];
      incoming.alt=item.title; incoming.src=ready[i]?item.image:'';
      if(!ready[i])incoming.removeAttribute('src');
      incoming.style.transition=immediate?'none':''; outgoing.style.transition=''; incoming.classList.add('bbe-shown'); outgoing.classList.remove('bbe-shown');card.dataset.layer=String(nextLayer);
      card.querySelector('.bbe-caption span').textContent=ready[i]?item.title:'이미지를 불러오지 못했습니다. 상세 보기';
    });
    [...tabs.children].forEach((tab,p)=>{tab.setAttribute('aria-selected',String(p===index));tab.tabIndex=p===index?0:-1;});
    stage.setAttribute('aria-labelledby','bbe-tab-'+index);
    count.textContent=(index*size()+1)+'~'+Math.min((index+1)*size(),items.length)+' / '+items.length;
    busy=false; schedule();
    const start=((index+1)%pageCount())*size(); items.slice(start,start+size()).forEach(item=>imageOK(item.image));
  }
  function restore() { if(!locked||dialog.open)return;locked=false;document.documentElement.style.overflow=overflow;if(focusBefore?.isConnected)focusBefore.focus({preventScroll:true}); }
  function close() { if(!dialog?.open)return;stop();clearInterval(refreshTimer);generation++;request?.abort();request=null;busy=false;dialog.close();restore(); }
  function hideToday() { const date=new Date();date.setHours(24,0,0,0);try{localStorage.setItem(KEY,String(+date));}catch(_){}close(); }
  function build() {
    dialog=node('dialog');dialog.id='bbe';dialog.setAttribute('aria-labelledby','bbe-title');
    const head=node('header','bbe-head'), title=node('h2','','뷰티블라썸 이벤트');title.id='bbe-title';
    pauseButton=button('Ⅱ','bbe-icon','자동 전환 일시정지',()=>pause(!paused));
    head.append(title,pauseButton,button('×','bbe-icon','팝업 닫기',close));
    state=node('div','bbe-state','이벤트를 불러오는 중입니다.');state.setAttribute('role','status');
    stage=node('div','bbe-stage');stage.id='bbe-stage';stage.setAttribute('role','tabpanel');
    for(let i=0;i<3;i++) {
      const card=node('a','bbe-card'), frame=node('div','bbe-image'), caption=node('div','bbe-caption');card.dataset.layer='0';card.target='_blank';card.rel='noopener';
      frame.append(node('img'),node('img'));caption.append(node('span'));card.append(frame,caption);card.addEventListener('click',()=>pause(true));stage.append(card);cards.push(card);
    }
    nav=node('div','bbe-nav');count=node('span','bbe-count');
    nav.append(button('←','bbe-icon','이전 이벤트',()=>{pause(true);show(index-1);}),count,button('→','bbe-icon','다음 이벤트',()=>{pause(true);show(index+1);}));
    tabs=node('div','bbe-tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','이벤트 순서');
    const foot=node('div','bbe-foot');foot.append(button('오늘 하루 보지 않기','','',hideToday),button('닫기','','',close));
    dialog.append(head,state,stage,nav,tabs,foot);document.body.append(dialog);
    dialog.addEventListener('cancel',e=>{e.preventDefault();close();});dialog.addEventListener('close',restore);
    dialog.addEventListener('keydown',e=>{
      if(e.key!=='Tab')return;
      const els=[...dialog.querySelectorAll('button,a[href]')].filter(el=>el.tabIndex>=0&&el.getClientRects().length&&!el.classList.contains('bbe-empty'));
      if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}
      if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}
    });
    dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});
    mobile.addEventListener('change',()=>{if(!dialog.open||!items.length)return;generation++;busy=false;index=0;renderTabs();show(0,true);});
    reduced.addEventListener('change',()=>{if(reduced.matches)pause(true);});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else schedule();});
    syncPause();
  }
  function valid(item) {
    try { const img=new URL(item.image),href=new URL(item.href);return img.protocol==='https:'&&img.hostname==='cdn.imweb.me'&&href.origin==='https://beautyblossom.kr'&&/^\/22\/?$/.test(href.pathname)&&typeof item.title==='string'; } catch(_){return false;}
  }
  async function refresh() {
    if(request || !dialog.open)return;
    request=new AbortController();const controller=request,timeout=setTimeout(()=>controller.abort(),20000);
    try {
      const response=await fetch(ENDPOINT,{signal:controller.signal,cache:'no-cache',credentials:'omit'});
      if(!response.ok)throw new Error('feed');
      const data=await response.json(),next=Array.isArray(data.items)?data.items.filter(valid):[];
      if(!next.length||data.truncated||next.length!==data.items.length)throw new Error('invalid_feed');
      if(!dialog.open||request!==controller)return;
      const changed=JSON.stringify(items)!==JSON.stringify(next);
      items=next;state.hidden=true;stage.hidden=false;tabs.hidden=false;nav.hidden=false;
      if(changed){preloads.clear();renderTabs();await show(0,true);}else if(!busy)schedule();
    } catch(_) {
      if(!dialog.open||request!==controller)return;stop();generation++;busy=false;items=[];
      stage.hidden=true;tabs.hidden=true;nav.hidden=true;state.hidden=false;
      state.textContent='이벤트를 불러오지 못했습니다.';
      const a=node('a','','이벤트 페이지 열기');a.href=SOURCE;a.target='_blank';a.rel='noopener';
      state.append(a,button('다시 시도','','',()=>refresh()));
    } finally { clearTimeout(timeout);if(request===controller)request=null; }
  }
  function open(respectHidden=false) {
    if(!document.body){document.addEventListener('DOMContentLoaded',()=>open(respectHidden),{once:true});return;}
    try{if(respectHidden&&Number(localStorage.getItem(KEY))>Date.now())return;}catch(_){}
    if(!dialog)build();if(dialog.open)return;
    focusBefore=document.activeElement;overflow=document.documentElement.style.overflow;
    dialog.showModal();locked=true;document.documentElement.style.overflow='hidden';
    stage.hidden=true;tabs.hidden=true;nav.hidden=true;state.hidden=false;state.textContent='이벤트를 불러오는 중입니다.';
    items=[];refresh();clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!document.hidden)refresh();},60000);
  }
  window.BBEvents=Object.freeze({open,close});
  if (true) open(true);
}());

</script></html>
